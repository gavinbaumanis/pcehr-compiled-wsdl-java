name: CI

on:
  push:
    branches: [ master, main, java-11-jakarta-full-wsdl ]
  pull_request:
    branches: [ master, main, java-11-jakarta-full-wsdl ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build and test
        run: mvn -B "-Dgpg.skip=true" clean verify
